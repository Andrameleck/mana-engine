services:
  api:
    build:
      context: .
    ports:
      - "8011-8012:8010"
    deploy:
      # Two replicas matched to the nginx upstream (127.0.0.1:8011 and :8012).
      replicas: 2
    environment:
      MTGCODEX_API_HOST: "0.0.0.0"
      MTGCODEX_API_PORT: "8010"
      MTGCODEX_API_PROJECT_DIR: "/app"
      XDG_CACHE_HOME: "/data/cache"
      MTGCODEX_SYNERGY_CACHE_DIR: "/data/cache/mtgcodex.api"
      SCRYFALL_BULK_TYPE: "${SCRYFALL_BULK_TYPE:-oracle_cards}"
      SCRYFALL_DB_PATH: "/data/cache/mtgcodex.api/all_cards.sqlite"
      ENRICH_CHUNK: "${ENRICH_CHUNK:-2000}"
      MTGCODEX_SCRYFALL_BOOTSTRAP: "${MTGCODEX_SCRYFALL_BOOTSTRAP:-auto}"
    volumes:
      - mtgcodex-cache:/data/cache
    restart: unless-stopped

volumes:
  mtgcodex-cache:
