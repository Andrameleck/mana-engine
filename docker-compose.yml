name: mana-engine

services:
  api:
    build:
      context: .
    ports:
      - "${MANA_ENGINE_API_PORT:-${MTGCODEX_API_PORT:-8010}}:8010"
    environment:
      MANA_ENGINE_API_HOST: "0.0.0.0"
      MANA_ENGINE_API_PORT: "8010"
      MANA_ENGINE_API_PROJECT_DIR: "/app"
      XDG_CACHE_HOME: "/data/cache"
      MANA_ENGINE_SYNERGY_CACHE_DIR: "/data/cache/mana-engine"
      SCRYFALL_BULK_TYPE: "${SCRYFALL_BULK_TYPE:-oracle_cards}"
      SCRYFALL_DB_PATH: "/data/cache/mana-engine/all_cards.sqlite"
      ENRICH_CHUNK: "${ENRICH_CHUNK:-2000}"
      MANA_ENGINE_SCRYFALL_BOOTSTRAP: "${MANA_ENGINE_SCRYFALL_BOOTSTRAP:-${MTGCODEX_SCRYFALL_BOOTSTRAP:-auto}}"
    volumes:
      - mana-engine-cache:/data/cache
    restart: unless-stopped

volumes:
  mana-engine-cache:
