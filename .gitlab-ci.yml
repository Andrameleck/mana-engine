stages:
  - checks
  - deploy

default:
  tags: [stable]

image: rocker/geospatial:latest

variables:
  CI_CACHE_DIR: "$CI_PROJECT_DIR/ci"
  R_LIBS_USER: "$CI_CACHE_DIR/lib"
  BRANCH_PAGES: "gitlab-pages"
  COVERAGE_REPORT: "$CI_CACHE_DIR/coverage.RDS"

cache:
  key:
  paths:
    - $CI_CACHE_DIR

.default_build:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        texlive-latex-base
        texlive-latex-recommended
        texlive-latex-extra
        texlive-fonts-recommended
        texlive-fonts-extra
        texinfo
        latexmk
    - rm -rf /var/lib/apt/lists/*
    - mkdir -p $R_LIBS_USER
    - echo "R_LIBS='$R_LIBS_USER'" > .Renviron
    - R -q -e 'if (!require(devtools)) install.packages(c("devtools", "remotes", "testthat"))'
    - R -q -e 'devtools::install_deps(dependencies = TRUE)'

check:
  rules:
    - if: '$CI_COMMIT_BRANCH == "gitlab-pages" || $CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: never
  extends: .default_build
  variables:
    NOT_CRAN: "true"
  stage: checks
  script:
    - R -q -e 'devtools::check(vignettes = TRUE, error_on = "error")'

cover-gen:
  stage: checks
  allow_failure: true
  extends: .default_build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
  script:
    - Rscript -e 'devtools::install()'
    - Rscript -e 'remotes::install_cran(c("covr", "DT"))'
    - Rscript -e 'cov <- covr::package_coverage(type = "all", quiet = FALSE);cov;saveRDS(cov, Sys.getenv("COVERAGE_REPORT"))'
  artifacts:
    paths:
      - ci/coverage.RDS
  coverage: '/mtgcodex_api Coverage: (\d+)\.\d+%/'

.deploy:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE != "schedule"'
  artifacts:
    paths:
      - public/

pkgdown:
  extends:
    - .default_build
    - .deploy
  stage: deploy
  needs:
   - job: check
   - job: cover-gen
  script:
    - R -q -e 'if (!require(pkgdown)) install.packages("pkgdown")'
    - R -q -e 'pkgdown::build_site()'
  artifacts:
    paths:
      - public/

manual:
  extends:
    - .default_build
    - .deploy
  stage: deploy
  needs:
    - job: pkgdown
      artifacts: true
  script:
    - mkdir -p public/user-manual
    - R CMD Rd2pdf . --output=public/user-manual/mtgcodex_api-manual.pdf
  artifacts:
    paths:
      - public/

cover-rep:
  extends:
    - .default_build
    - .deploy
  stage: deploy
  needs:
    - job: pkgdown
      artifacts: true
    - job: cover-gen
      artifacts: true
  script:
    - R -q -e 'remotes::install_cran(c("covr", "DT"))'
    - R -q -e 'covr::report(readRDS(Sys.getenv("COVERAGE_REPORT")), "public/coverage.html")'
  artifacts:
    paths:
      - public/

pages:
  extends: .deploy
  stage: deploy
  pages: true
  needs:
    - job: pkgdown
      artifacts: true
    - job: manual
      artifacts: true
    - job: cover-rep
      artifacts: true
  script:
    - git add -f public
    - git config --global user.email "gitlab-ci@inrae.fr"
    - git config --global user.name "GitLab CI"
    - git commit -m "Update GitLab pages"

    # Capture the current commit hash for cherry-picking
    - HASH_COMMIT_PAGES="$(git rev-parse HEAD)"

    # Set remote URL for pushing changes
    - git remote set-url origin https://whatever:${PAGES_TOKEN}@forge.inrae.fr/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}.git

    # Checkout or create the branch
    - |
      if git ls-remote --exit-code --heads origin "$BRANCH_PAGES" > /dev/null; then
        echo "Remote branch '$BRANCH_PAGES' exists. Checking out and resetting."
        git fetch origin "$BRANCH_PAGES"
        git checkout -B "$BRANCH_PAGES" origin/"$BRANCH_PAGES"
      else
        echo "Remote branch '$BRANCH_PAGES' does not exist. Creating new local branch."
        git checkout -b "$BRANCH_PAGES"
        find . -maxdepth 1 -mindepth 1 ! -name public ! -name .git ! -name ci -exec rm -rf {} +
        git add .
        git commit -m "gitlab-pages initialization"
      fi

    # Cherry-pick the latest commit to the new branch
    - |
      git cherry-pick "$HASH_COMMIT_PAGES" --strategy-option theirs || \
        (if git status | grep -q 'You are currently cherry-picking'; then
          echo "Cherry-pick resulted in empty commit. Skipping."
          git cherry-pick --skip
        else
          echo "Cherry-pick failed unexpectedly." >&2
          exit 1
        fi)

    # Push the changes to the remote
    - git push --set-upstream origin "$BRANCH_PAGES"