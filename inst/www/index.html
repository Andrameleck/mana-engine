<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mtgcodex.api Collection Loader</title>
  <link rel="stylesheet" href="/ui/static/styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="hero-tools">
        <div class="lang-switch" role="group" aria-label="Langue d'affichage">
          <button type="button" id="lang-en" class="lang-btn is-active">EN</button>
          <button type="button" id="lang-fr" class="lang-btn">FR</button>
        </div>
      </div>
      <div>
        <p class="eyebrow">MTG Collection</p>
        <h1>Charger et afficher</h1>
        <p class="sub">Charge un fichier db, csv ou text et affiche son contenu.</p>
      </div>
    </header>

    <section class="panel">
      <div class="panel-head">
        <h2>Source</h2>
      </div>
      <form id="load-form" class="grid">
        <label for="source-type">
          Type
          <select id="source-type">
            <option value="db">db</option>
            <option value="csv">csv</option>
            <option value="text">text</option>
          </select>
        </label>
        <label for="source-file-name">
          Fichier selectionne
          <input id="source-file-name" type="text" placeholder="Aucun fichier selectionne" readonly>
          <input id="source-file" type="file" class="hidden-file-input">
        </label>
        <label for="source-table">
          Table (db uniquement)
          <input id="source-table" type="text" placeholder="cards (optionnel)">
        </label>
        <div class="actions">
          <button type="button" id="pick-file">Choisir un fichier</button>
          <button type="submit">Charger le fichier</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="table-title">Collection</h2>
        <div id="load-summary" class="summary muted">Aucune collection chargee.</div>
      </div>
      <div id="table-wrap" class="table-wrap"></div>
      <div id="table-scrollbar" class="table-scrollbar" aria-hidden="true">
        <div id="table-scrollbar-inner"></div>
      </div>
    </section>
  </main>

  <aside id="card-preview" class="card-preview hidden" aria-live="polite">
    <div class="card-preview-head">
      <strong id="card-preview-title">Carte</strong>
      <button type="button" id="card-preview-close" class="card-preview-close" aria-label="Fermer le panneau">x</button>
    </div>
    <div class="card-preview-body">
      <img id="card-preview-image" alt="Apercu de la carte" loading="lazy">
      <p id="card-preview-text" class="muted"></p>
      <dl id="card-preview-meta" class="card-preview-meta"></dl>
    </div>
  </aside>

  <script src="/ui/static/api.js"></script>
  <script src="/ui/static/ui.js"></script>
  <script src="/ui/static/main.js"></script>
</body>
</html>
