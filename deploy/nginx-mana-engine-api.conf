upstream mana_engine_api_upstream {
    server 127.0.0.1:8011;
    server 127.0.0.1:8012;
    keepalive 32;
}

server {
    listen 51.38.230.244:8010;
    server_name _;
    client_max_body_size 100M;

    # Deck generation and synergy scoring can take several minutes on a cold
    # cache when scoring against the full Scryfall catalog (~40k cards).
    # Bump proxy timeouts so long-running compute requests aren't killed by
    # nginx with HTTP 504.
    proxy_connect_timeout 30s;
    proxy_send_timeout    1200s;
    proxy_read_timeout    1200s;
    send_timeout          1200s;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass http://mana_engine_api_upstream;
    }
}
