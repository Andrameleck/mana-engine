name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CRAN_MIRROR: https://cloud.r-project.org
  CI_CACHE_DIR: ${{ github.workspace }}/ci
  R_LIBS_USER: ${{ github.workspace }}/ci/lib
  COVERAGE_REPORT: ${{ github.workspace }}/ci/coverage.RDS
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  check:
    name: R Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texinfo \
            latexmk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: "always"
          extra-packages: |
            any::devtools
            any::testthat
          dependencies: '"all"'

      - name: Run package checks
        env:
          NOT_CRAN: "true"
        run: Rscript -e "devtools::check(vignettes = TRUE, error_on = 'error')"

  coverage:
    name: Coverage RDS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: "always"
          extra-packages: |
            any::devtools
            any::covr
            any::DT
          dependencies: '"all"'

      - name: Ensure coverage directory exists
        run: mkdir -p "$CI_CACHE_DIR"

      - name: Generate coverage RDS
        run: |
          Rscript -e "devtools::install()"
          Rscript -e "cov <- covr::package_coverage(type = 'all', quiet = FALSE); print(cov); saveRDS(cov, Sys.getenv('COVERAGE_REPORT'))"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rds
          path: ${{ env.COVERAGE_REPORT }}
          if-no-files-found: ignore

  deploy-pages:
    name: Build And Deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - check
      - coverage
    if: always() && needs.check.result == 'success' && github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texinfo \
            latexmk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: "always"
          extra-packages: |
            any::devtools
            any::pkgdown
            any::covr
            any::DT
          dependencies: '"all"'

      - name: Ensure CI cache directory exists
        run: mkdir -p "$CI_CACHE_DIR"

      - name: Download coverage artifact (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-rds
          path: ${{ env.CI_CACHE_DIR }}

      - name: Build pkgdown site, manual and coverage HTML
        run: |
          Rscript -e "pkgdown::build_site()"
          mkdir -p public/user-manual
          R CMD Rd2pdf . --output=public/user-manual/mtgcodex.api_api-manual.pdf

          if [ -f "$COVERAGE_REPORT" ]; then
            Rscript -e "covr::report(readRDS(Sys.getenv('COVERAGE_REPORT')), 'public/coverage.html')"
          else
            echo "Coverage artifact not found. Skipping coverage HTML report."
          fi

      - name: Check if Pages is enabled
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Try to enable Pages (optional admin token)
        if: steps.pages_status.outputs.enabled != 'true' && env.PAGES_ADMIN_TOKEN != ''
        uses: actions/configure-pages@v6
        with:
          token: ${{ env.PAGES_ADMIN_TOKEN }}
          enablement: true

      - name: Re-check Pages status
        id: pages_status_after
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages-after.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy when Pages is disabled
        if: steps.pages_status_after.outputs.enabled != 'true'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repository."
          echo "::warning::Enable it in Settings > Pages, Source = GitHub Actions."

      - name: Setup GitHub Pages
        if: steps.pages_status_after.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages_status_after.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.pages_status_after.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
